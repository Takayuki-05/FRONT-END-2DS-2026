<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula02 - menu hamburguer</title>

    <style>
            .navbar {
             background-color: black;
          }
            .logo {
                color: white;
            }

                /*Estilo de lista de links*/
            .nav-links{
                 list-style: none;
                display: flex; /*exibe horizontalmente o menu*/
                gap: 20px;
                margin: 0;
                padding: 0;
            }
             .nav-links a {
                  color: aqua;
                 text-decoration: none;
                font-size: 20px;
             }

                /*estilo do botão hamburguer(escondido no desktop)*/
             .hamburguer{
                    display: none;
                     background: none;
                    border: none;
                    color: white;
                     font-size: 24px;
                    cursor: pointer;
             }
             
             @media screen and (max-width: 768px){
                .hamburguer{
                    display: block; /*exibe o botão hamburguer em telas menores*/
                }
            
             /*esconde a lista e muda o layout para vertical*/
             .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px; /*altura da navbar*/
                left: 0;
                width: 100%;
                border: black;
                text-align: center;
                padding: 20px;
                }

             }
    </style>

</head>
<body>

    <nav class="navbar">
        <div class="logo">Meu site</div>

        <!-- Botão Hamburguer para responsividade -->
        <button class="hamburguer" id="hamburguer-btn">
            &#9776; <!-- Símbolo do ícone de menu -->
        </button>

        <!-- Lista de itens do menu -->
        <ul class="nav-links" id="nav-links">
            <li>
                <a href="#">Início</a>
                <a href="#">Sobre</a>
                <a href="#">Serviços</a>
                <a href="#">Contato</a>
            </li>
        </ul>
    </nav>
    
    <div style="padding: 20px;">
        <h1>Conteúdo da página</h1>
        <p>Redimensione a janela do navegador para ver o menu mudar.</p>
    </div>
    <a hidden="" style="text-decoration: none; color: brown;">qualquer coisa</a>

    <script>
        //SELICIONA OS ELEMENTOS DE HTML
        const hamburguerbtn = document .getElementById('hamburguer-btn');
        const navlinks = document.getElementById('nav-links')

        //ADICIONA UM EVENTO AO BOTÃO DE CLICK
        hamburguerbtn.addEventListener('click',() => {
            navLinks.classList .toggle('active');
        })
    </script>

</body>
</html>
