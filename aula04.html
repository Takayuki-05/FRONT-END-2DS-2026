<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="aula04.css">
    <title>Aula04 - Tela de login</title>
</head>
<body>

    <div class="form-container">
        <img src="https://ih1.redbubble.net/image.2154971928.1128/st,small,845x845-pad,1000x1000,f8f8f8.jpg" height="50%" width="50%">
        <h2>Bem vindo de volta</h2>
        <p>Faça login para acessar sua conta</p>
        <form action="">
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        
        <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Informe sua senha" required>
        </div>
        <button type="submit">Entrar</button>
    </form>
    <div class ="footer-link">
        Não tem uma conta? <a href="">Cadastre-se</a>
    </div>
</div>
    
</body>
</html>
