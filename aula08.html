<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula08 slides html e css</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }
        .slider{
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 16/ 9;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 25px 50px -12px rgba(0,0,0,0,5);
        }

        .slider-input [type="radio"]{
            display: none;
        }

        .slides{
            display: flex;
            width: 300%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
    </style>
</head>
<body>

    <div class="slider">
        <!--inputs que controlam o estado oculto do slider-->
        <input type="radio" name="controle" id="s1" checked>
        <input type="radio" name="controle" id="s2">
        <input type="radio" name="controle" id="s3">

        <div class="slides">
            <div class="slide">
                <h2>Slide 1</h2>
                <p>Exemplo de slide com html e css</p>
            </div>
            <div class="slide">
                <h2>Slide 2</h2>
                <p>Exemplo de slide com html e css</p>
            </div>
            <div class="slide">
                <h2>Slide 3</h2>
                <p>Exemplo de slide com html e css</p>
            </div>
        </div>

        <div class="dots">
            <label for="s1"></label>
            <label for="s2"></label>
            <label for="s3"></label>
        </div>
    </div>
    
</body>
</html>
